name: PRS935
display_name: PRS935
version: 8.1.0
theme_key: 4bac5404264ffdc7c07a216f8fd60484
author:
  name: "Silvertheme"
  email: "support@silvertheme.com"
  url: "http://www.prestashop.com"

meta:
  compatibility:
      from: 1.7.0.0
      to: ~

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

assets:
  # If you're using this theme as child and you want to load
  # the parent theme assets, uncomment this line.
#  use_parent_assets: true

  # The following lines are showing how to load assets in your page
  # Uncomment and change value to start loading css or js files
#  css:
#    all:
#      - id: custom-lib-style
#        path: assets/css/custom-lib.css
#    product:
#      - id: product-style
#        path: assets/css/product.css
#        media: all
#        priority: 200
   css:
     all:
      - id: owl-carousel-style
        path: assets/css/owl.carousel.css
      # Brand palette. High priority so it loads after theme.css and wins
      # on specificity ties. Generated from theme.css by inspecting which
      # selectors use the stock red/orange accents - see the file header.
      - id: spz-brand-palette
        path: assets/css/spz-brand.css
        media: all
        priority: 1000
      # Design layer: type, components, interaction. Palette tokens come
      # from spz-brand.css, so this loads after it.
      - id: spz-modern-style
        path: assets/css/spz-modern.css
        media: all
        priority: 1010
   js:
     all:
       # In <head>, so the store is hidden before first paint until the
       # visitor confirms they are 18+. Self-contained.
       - id: spz-age-gate
         path: assets/js/spz-age-gate.js
         priority: 1
         position: head
       - id: spz-modern-script
         path: assets/js/spz-modern.js
         priority: 1000
         position: bottom
       - id: owl-carousel-theme
         path: assets/js/owl.carousel.js
         priority: 610
         position: bottom
       - id: parallax-lib
         path: assets/js/ParallaxBackground.js
         priority: 620
         position: bottom
       - id: totalstorage-lib
         path: assets/js/jquery.total-storage.min.js
         priority: 630
       - id: top-lib
         path: assets/js/jquery.ui.totop.js
         priority: 640
         position: bottom       
#  js:
#    cart:
#      - id: cat-extra-lib
#        path: assets/js/cart-lib.js


global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
  modules:
   to_enable:
     - ps_linklist
   to_disable:
     - ps_imageslider 
     - ps_featuredproducts
     - ps_newproducts
     - ps_bestsellers
     - ps_specials
     - ps_categoryproduct
     - ps_contactinfo
     - ps_banner
     - ps_customtext
  hooks:
    custom_hooks:
      - name: displayTopColumn
        title: displayTopColumn
        description: Display Content on Top Column After displayTop
      - name: displayHomeTop
        title: displayHomeTop
        description: Display Content After displayTopColumn
      - name: displayHomeBottom
        title: displayHomeBottom
        description: Display Content After displayHome
      - name: displayLogoBefore
        title: displayLogoBefore
        description: Display Content Before Logo
      - name: displayLogoAfter
        title: displaybtnAfter
        description: Display Content After Logo
    modules_to_hook:
      displayAfterBodyOpeningTag:
        - blockreassurance
      displayNavFullWidth:
        - blockreassurance
      displayAdminCustomers:
        - blockwishlist
      displayMyAccountBlock:
        - blockwishlist
      displayNav1:
        - ttheadercall
        - ps_customersignin
      displayNav2:
        - ps_currencyselector
        - ps_languageselector
      displayLogoBefore:
        - ps_searchbar
      displayLogoAfter:
        - tt_shippinggrid
        - ps_shoppingcart
      displayTop:
        - ps_mainmenu
      displayTopColumn:
        - ttslideshows
        - ttsubbanner
      displayHomeTop:
        - otfeaturedproducts
        - tt_bannerslider
      displayHome:
        - otspecials
        - otbestsellers
      displayHomeBottom: 
        - tt_testimonialslider
        - otbrandlist
      displayFooterBefore: 
      displayFooter:
        - ttfooterleftblock
        - ps_linklist
        - ttfooteraddress
        - blockwishlist
      displayFooterAfter:
        - ps_emailsubscription
      displayFooterBottom:
      displayLeftColumn:
        - ps_categorytree
        - ps_facetedsearch
        - ttleftbannerblock
        - otleftnewproducts
      displaySearch:
        - ps_searchbar
      displayCustomerAccount:
        - blockwishlist
        - psgdpr    
      displayProductAdditionalInfo:
        - ps_sharebuttons
      displayReassurance:
        - blockreassurance
      displayOrderConfirmation2:
        - otfeaturedproducts
      displayCrossSellingShoppingCart:
        - otfeaturedproducts
      displayProductActions:
        - blockwishlist   

  image_types:
    cart_default:
      width: 125
      height: 176
      scope: [products]
    small_default:
      width: 98
      height: 138
      scope: [products, categories, manufacturers, suppliers]
    medium_default:
      width: 450
      height: 633
      scope: [products, manufacturers, suppliers]
    home_default:
      width: 310 
      height: 436
      scope: [products]
    homecategory_default:
      width: 110 
      height: 155
      scope: [products]
    large_default:
      width: 700
      height: 984
      scope: [products, manufacturers, suppliers]
    category_default:
      width: 1005
      height: 160
      scope: [categories]
    stores_default:
      width: 170
      height: 239
      scope: [stores]
  new_password_policy_feature: true     

